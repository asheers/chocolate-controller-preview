<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follower test</title>
<style>
body{margin:0;padding:24px;background:#141715;color:#f3f0e7;font-family:Helvetica,Arial,sans-serif}
#message{font-size:64px;font-weight:bold;color:#c1ed83;margin:40px 0;word-wrap:break-word}
#status{font-size:20px;color:#a7b3a9}
.error{color:#ffb4a6!important}
</style></head><body>
<h1>Chocolate follower test v2</h1>
<div id="message">Waiting for a message…</div>
<div id="status">Starting…</div>
<script>
// Deliberately ES5: this page must run on iOS 9 Safari. One long-lived SSE stream instead of polling,
// because ntfy.sh rate-limits per public IP (shared with every device on the same Wi-Fi).
var TOPIC = 'choc-follow-ae3bfd70afbb', received = 0;
function show(id, text, isError) { var el = document.getElementById(id); el.textContent = text; el.className = isError ? 'error' : ''; }
function time() { return new Date().toLocaleTimeString(); }
function handle(e) {
  var m; try { m = JSON.parse(e.data); } catch (err) { return; }
  if (m.event === 'message') { received++; show('message', m.message); show('status', 'Live ✓ · ' + received + ' received · last at ' + time()); }
  else if (m.event === 'keepalive' || m.event === 'open') show('status', 'Live ✓ · ' + received + ' received · still connected at ' + time());
}
if (!window.EventSource) show('status', 'This browser has no EventSource', true);
else {
  var source = new EventSource('https://ntfy.sh/' + TOPIC + '/sse');
  source.onopen = function () { show('status', 'Live ✓ · connected at ' + time()); };
  source.onmessage = handle;
  source.addEventListener('open', handle);
  source.addEventListener('keepalive', handle);
  source.onerror = function () { show('status', 'Connection lost, retrying… · ' + time(), true); };
}
</script>
</body></html>
